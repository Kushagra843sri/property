# Render Blueprint for the API. Secrets are NOT stored here: entries with `sync: false` are
# typed by the owner in the Render dashboard; the two JWT secrets are generated by Render.
# Steps are in docs/deploy.md.
services:
  - type: web
    name: shyam-homes-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: server
    # --include=dev: NODE_ENV=production would otherwise skip the TypeScript compiler.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: TRUST_PROXY
        value: 1
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://www.shyamhomes.co.in,https://shyamhomes.co.in
      - key: CLIENT_URL
        value: https://www.shyamhomes.co.in
      - key: COOKIE_DOMAIN
        value: .shyamhomes.co.in
      - key: MAIL_PROVIDER
        value: resend
      - key: MAIL_FROM
        value: Shree Shyam Properties <noreply@shyamhomes.co.in>
      - key: DEALER_NOTIFY_EMAIL
        value: shyamshree1233@gmail.com
      - key: GOOGLE_CLIENT_ID
        value: 278180640031-4setobi9do3ifud2n6u8nulfsip6e4ji.apps.googleusercontent.com
      - key: IMAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        value: mvh26fyw
      # The video library id is public. BUNNY_API_KEY is a secret: add it in the Render dashboard.
      - key: BUNNY_LIBRARY_ID
        value: 823842
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
